name: Scrape latest data

on:
  #push:
  workflow_dispatch:
  schedule:
    - cron: '49 */12 * * *'

jobs:
  scheduled:
    runs-on: ubuntu-22.04
    steps:
    - name: Check out this repo
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install deps
      run: npm i -g osmtogeojson      

    - name: Get the data and analyze
      run: |
        chmod +x ./umap.sh
        ./umap.sh
      shell: bash

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Atualizado para uma versão suportada nativamente

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install shapely

    - name: Processa Todos.geojson e depois cria a lista
      run: |
        #python proc_postos_osm2.py
        python proc_postos_osm3.py
        python proc_postos_erros.py
        python list2d.py
        python list2e.py
        python list2f.py
        python listf1.py
        python consistency.py

    - name: Commit and push if it changed
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date -u)
        git commit -m "Latest data: ${timestamp}" || exit 0
        git push
